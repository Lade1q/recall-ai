  --card:oklch(0.995 0.002 262); --border:oklch(0.76 0.005 262);
  --muted:oklch(0.955 0.006 262); --muted-foreground:oklch(0.53 0.012 262);
  --primary:oklch(0.5 0.16 262); --primary-foreground:oklch(0.985 0.006 262);
  --ai-accent:oklch(0.5 0.1 235); --remediate:oklch(0.5 0.14 55);
  --mastery-strong:oklch(0.5 0.08 155); --mastery-learning:oklch(0.5 0.1 85);
  --mastery-weak:oklch(0.5 0.15 25); --mastery-untested:oklch(0.75 0.008 262);
  --shadow-soft:0 2px 8px oklch(0 0 0 / .08); --radius:0.625rem;
}
.dark{
  --background:oklch(0.17 0.006 262); --foreground:oklch(0.93 0.005 262);
  --card:oklch(0.21 0.007 262); --border:oklch(1 0 0 / 24%);
  --muted:oklch(0.26 0.008 262); --muted-foreground:oklch(0.68 0.012 262);
  --primary:oklch(0.56 0.17 262); --primary-foreground:oklch(0.985 0.006 262);
  --ai-accent:oklch(0.72 0.1 235); --remediate:oklch(0.72 0.13 55);
  --mastery-strong:oklch(0.72 0.1 155); --mastery-learning:oklch(0.75 0.12 85);
  --mastery-weak:oklch(0.68 0.16 25); --mastery-untested:oklch(0.4 0.01 262);
  --shadow-soft:0 2px 8px oklch(0 0 0 / .22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font-family:'Geist V',system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:60px}
h1,h2,h3,h4{font-family:'Noto Serif V',Georgia,serif;font-weight:600}
.mono{font-family:'Geist Mono V',monospace;font-variant-numeric:tabular-nums}

/* chrome của trang trình bày, KHÔNG thuộc thiết kế */
.pagebar{position:sticky;top:0;z-index:60;background:var(--background);border-bottom:1px solid var(--border);padding:12px 0}
.pagebar .in{max-width:1600px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pagebar h1{font-size:16px}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;
  border-radius:999px;border:1px solid var(--border);color:var(--muted-foreground);background:transparent;
  cursor:pointer;font-family:'Geist V',sans-serif}
.pill:hover{color:var(--foreground)}
.pill.on{border-color:var(--primary);color:var(--primary)}
.spacer{flex:1}
.stage{max-width:1600px;margin:24px auto 0;padding:0 24px}
.caption{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;max-width:100ch}
.caption b{color:var(--foreground)}

/* ===== APP SHELL ===== */
.app{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:var(--background);box-shadow:var(--shadow-soft);min-height:760px}
.side{background:color-mix(in oklab,var(--muted) 45%,var(--background));border-right:1px solid var(--border);padding:20px 16px}
.brand{font-family:'Noto Serif V',serif;font-weight:600;font-size:17px;color:var(--primary);padding:0 8px 18px;
  border-bottom:1px solid var(--border);margin-bottom:14px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:8px;
  text-decoration:none;color:var(--foreground);font-size:13.5px}
.nav a.on{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.nav a .ic{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;opacity:.65;flex:none}
.main{padding:24px 28px;display:flex;flex-direction:column;min-width:0}

.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.head h2{font-size:30px;line-height:1.15}
.head .sub{font-size:12.5px;color:var(--muted-foreground);margin-top:3px}
.btn{font-size:12.5px;padding:7px 13px;border-radius:calc(var(--radius) - 3px);border:1px solid var(--border);
  background:transparent;color:var(--foreground);cursor:pointer;font-family:'Geist V',sans-serif;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.pri{background:var(--primary);color:var(--primary-foreground);border-color:transparent;font-weight:600}
.btn.sm{font-size:11.5px;padding:5px 10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* chuyển view */
.views{display:inline-flex;background:var(--muted);border-radius:999px;padding:3px;gap:2px;margin-bottom:16px}
.views button{font-size:12.5px;font-weight:600;padding:6px 18px;border-radius:999px;border:0;background:transparent;
  color:var(--muted-foreground);cursor:pointer;font-family:'Geist V',sans-serif}
.views button.on{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-soft)}

/* banner draft */
.banner{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 14px;border-radius:8px;margin-bottom:14px;
  background:color-mix(in oklab,var(--ai-accent) 11%,transparent);border-left:2px solid var(--ai-accent)}
.banner b{font-weight:600}
.banner a{color:var(--ai-accent);font-weight:600;text-underline-offset:2px;cursor:pointer}

/* THANH CÒN NỢ — trên lưới, độc lập tháng */
.debtbar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--radius);margin-bottom:14px;
  /* /7 chứ không phải /10: chữ phụ --muted-foreground trên tint /10 chỉ đạt 4,31 ở light mode (< 4.5 AA) */
  background:color-mix(in oklab,var(--mastery-weak) 7%,transparent);
  border:1px solid color-mix(in oklab,var(--mastery-weak) 35%,transparent);cursor:pointer;text-align:left;
  font-family:inherit;color:inherit;width:100%}
.debtbar:hover{background:color-mix(in oklab,var(--mastery-weak) 11%,transparent)}
.debtbar .t{font-family:'Noto Serif V',serif;font-weight:600;font-size:15px}
.debtbar .n{font-family:'Geist Mono V',monospace;font-size:13px;color:var(--mastery-weak);font-weight:600}
.debtbar .d{font-size:12px;color:var(--muted-foreground)}
.debtbar.ok{background:color-mix(in oklab,var(--mastery-strong) 9%,transparent);
  border-color:color-mix(in oklab,var(--mastery-strong) 30%,transparent);cursor:default}
.debtbar.ok .n{color:var(--mastery-strong)}

/* toolbar lịch */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.month{font-family:'Noto Serif V',serif;font-weight:600;font-size:17px;min-width:130px}
/* ===== BỘ LỌC KẾ HOẠCH — danh sách checkbox trong dropdown =====
   Lấy hình thức checkbox + danh sách dọc của Google Calendar, BỎ màu:
   vòng màu đã chịu lực cho mastery + truy ngược, danh tính plan = nhãn chữ. */
.filt{position:relative}
.filt>button{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 12px;
  border-radius:calc(var(--radius) - 3px);border:1px solid var(--border);background:transparent;
  color:var(--foreground);cursor:pointer;font-family:inherit;white-space:nowrap}
.filt>button:hover{background:var(--muted)}
.filt>button.act{border-color:var(--primary);color:var(--primary)}
.filt>button .cnt{font-family:'Geist Mono V',monospace;font-size:11.5px;color:var(--muted-foreground)}
.filt>button.act .cnt{color:var(--primary)}
.filt>button .car{font-size:9px;opacity:.6}
/* Cuộn: chỉ DANH SÁCH cuộn, header + ghi chú đứng yên — nhiều kế hoạch thì "Bỏ chọn tất cả"
   không được trôi mất. Trần bám viewport (60vh) chứ không phải px cứng, để màn thấp không tràn. */
.fmenu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:288px;
  max-height:min(360px,60vh);display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 28px oklch(0 0 0 / .28)}
.flist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 5px}
.fhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px 9px;
  border-bottom:1px solid color-mix(in oklab,var(--border) 55%,transparent)}
.fhead span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.fhead button{font-size:11.5px;border:0;background:transparent;color:var(--primary);cursor:pointer;
  font-family:inherit;padding:2px 4px;border-radius:4px}
.fhead button:hover{background:var(--muted)}
.frow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border:0;background:transparent;
  color:inherit;cursor:pointer;font-family:inherit;border-radius:6px;text-align:left}
.frow:hover{background:var(--muted)}
.frow .box{width:15px;height:15px;flex:none;border-radius:4px;border:1.5px solid var(--muted-foreground);
  display:grid;place-items:center}
.frow.on .box{background:var(--primary);border-color:var(--primary)}
.frow .tick{width:8px;height:5px;border-left:2px solid var(--primary-foreground);
  border-bottom:2px solid var(--primary-foreground);transform:rotate(-45deg) translate(1px,-1px);display:none}
.frow.on .tick{display:block}
.frow .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .n{font-family:'Geist Mono V',monospace;font-size:11.5px;color:var(--muted-foreground)}
.frow.zero .nm,.frow.zero .n{color:var(--muted-foreground);opacity:.6}
.fnote{flex:none;font-size:11px;color:var(--muted-foreground);padding:9px 14px 10px;line-height:1.4;
  border-top:1px solid color-mix(in oklab,var(--border) 55%,transparent);background:var(--card)}

/* ===== LƯỚI + PANEL ===== */
.body{display:grid;grid-template-columns:1fr;gap:16px;flex:1;min-height:0}
.body.withpanel{grid-template-columns:1fr 340px}
.cal{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.dow div{padding:8px 10px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted-foreground);border-right:1px solid var(--border)}
.dow div:last-child{border-right:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;flex:1;position:relative}
.cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 6px;
  display:flex;flex-direction:column;gap:3px;min-height:104px;cursor:pointer;background:transparent;
  font-family:inherit;color:inherit;text-align:left;position:relative}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:color-mix(in oklab,var(--muted) 55%,transparent)}
.cell.out{background:color-mix(in oklab,var(--muted) 35%,transparent);cursor:default}
.cell.out .dnum{opacity:.3}
.cell.out:hover{background:color-mix(in oklab,var(--muted) 35%,transparent)}
.cell.late{background:color-mix(in oklab,var(--mastery-weak) 7%,transparent)}
.cell.sel{outline:2px solid var(--primary);outline-offset:-2px;z-index:2}
.crow{display:flex;align-items:center;justify-content:space-between;gap:4px}
.dnum{font-family:'Geist Mono V',monospace;font-size:12px;color:var(--muted-foreground)}
.cell.today .dnum{background:var(--primary);color:var(--primary-foreground);width:21px;height:21px;
  border-radius:999px;display:grid;place-items:center;font-weight:600;font-size:11.5px}
.dmin{font-family:'Geist Mono V',monospace;font-size:10px;color:var(--muted-foreground)}
.chip{display:flex;align-items:center;gap:4px;font-size:11px;padding:3px 5px;border-radius:4px;
  background:var(--muted);border-left:2px solid var(--mastery-untested);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.35}
.chip.tb{border-left-color:var(--remediate)}
.chip.late{border-left-color:var(--mastery-weak)}
.more{font-size:10px;color:var(--muted-foreground);padding-left:5px}
.emptymonth{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:24px}
.emptymonth>div{text-align:center;max-width:46ch;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow-soft)}
.emptymonth .big{font-family:'Noto Serif V',serif;font-weight:600;font-size:16px;margin-bottom:5px}
.emptymonth .sm{font-size:12.5px;color:var(--muted-foreground)}

/* PANEL NGÀY */
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);
  display:flex;flex-direction:column;overflow:hidden}
.ph{padding:14px 16px;border-bottom:1px solid var(--border)}
.ph .r1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ph h3{font-size:19px;line-height:1.2}
.ph .meta{font-size:12px;color:var(--muted-foreground);margin-top:3px}
.ph .late{color:var(--mastery-weak);font-weight:600}
.px{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;font-size:17px;
  line-height:1;padding:2px 5px;border-radius:5px;font-family:inherit}
.px:hover{background:var(--muted);color:var(--foreground)}
.plist{flex:1;overflow:auto;padding:6px 0}
.pitem{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid color-mix(in oklab,var(--border) 45%,transparent);
  padding:11px 16px;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:5px}
.pitem:hover{background:color-mix(in oklab,var(--muted) 50%,transparent)}
.pitem.open{background:color-mix(in oklab,var(--muted) 60%,transparent)}
.pl1{display:flex;align-items:center;gap:7px}
.pl1 .nm{font-size:14px;font-weight:500}
.dot{width:7px;height:7px;border-radius:2px;flex:none}
.m-weak{background:var(--mastery-weak)} .m-strong{background:var(--mastery-strong)}
.m-learn{background:var(--mastery-learning)} .m-untested{background:var(--mastery-untested)}
.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;
  background:color-mix(in oklab,var(--remediate) 14%,transparent);color:var(--remediate)}
.pl2{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted-foreground);flex-wrap:wrap}
.planlabel{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
.why{font-size:12.5px;background:color-mix(in oklab,var(--remediate) 10%,transparent);
  border-left:2px solid var(--remediate);padding:7px 11px;border-radius:0 5px 5px 0;margin-top:2px}
.why.sr{background:color-mix(in oklab,var(--ai-accent) 9%,transparent);border-left-color:var(--ai-accent)}
.why a{color:var(--remediate);font-weight:600;cursor:pointer;text-underline-offset:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.lock{display:block;width:100%;font-size:11.5px;color:var(--muted-foreground);font-style:italic;
  margin-top:6px;padding-left:9px;border-left:2px solid color-mix(in oklab,var(--muted-foreground) 40%,transparent);line-height:1.45}
.pempty{padding:26px 18px;text-align:center;color:var(--muted-foreground);font-size:12.5px}

/* view Kế hoạch */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px}
.card h4{font-size:17px;margin-bottom:3px}
.card .cm{font-family:'Geist Mono V',monospace;font-size:11.5px;color:var(--muted-foreground);margin-bottom:11px}
.bar{height:7px;border-radius:3px;background:var(--muted);overflow:hidden;display:flex;margin-bottom:10px}
.cnts{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11.5px;color:var(--muted-foreground)}
.cnts span b{color:var(--foreground);font-family:'Geist Mono V',monospace}
.cfoot{margin-top:11px;padding-top:10px;border-top:1px solid color-mix(in oklab,var(--border) 50%,transparent);
  font-size:12px;color:var(--muted-foreground)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{font-size:13px;padding:9px 13px;border:0;background:transparent;color:var(--muted-foreground);
  cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;margin-bottom:-1px}
.tabs button.on{color:var(--foreground);font-weight:600;border-bottom-color:var(--foreground)}
.tabs button .n{font-family:'Geist Mono V',monospace;font-size:11px;opacity:.6;margin-left:5px}

/* đếm gọn trong ô — chỉ dùng ở bề ngang hẹp */
.cellmini{display:none;align-items:center;gap:3px;margin-top:2px}
.cellmini i{width:5px;height:5px;border-radius:999px;background:var(--mastery-untested);display:block}
.cellmini i.tb{background:var(--remediate)} .cellmini i.late{background:var(--mastery-weak)}
.cellmini b{font-family:'Geist Mono V',monospace;font-size:10px;color:var(--muted-foreground);font-weight:600}

/* ===== RESPONSIVE ===== */
@media (max-width:1180px){
  .body.withpanel{grid-template-columns:1fr}          /* panel rơi xuống dưới lưới */
  .panel{max-height:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}                                  /* MainLayout thật đã có drawer riêng */
  .main{padding:18px 16px}
  .head h2{font-size:24px}
}
@media (max-width:680px){
  /* Lưới tháng KHÔNG cõng nổi chip ở 7 cột hẹp — ô chỉ còn số ngày + mật độ.
     Toàn bộ chi tiết chuyển sang panel, đó vốn là thao tác chính trên cảm ứng. */
  .cell{min-height:58px;padding:4px}
  .cell .chip,.cell .more,.cell .dmin{display:none}
  .cellmini{display:flex}
  .dow div{padding:6px 4px;font-size:9.5px}
  .debtbar{flex-wrap:wrap;gap:6px}
  .debtbar .d{width:100%;font-size:11px}
  .tools{gap:6px}
  .month{font-size:15px;min-width:0;flex:1}
}
</style>
</head>
<body>

<div class="pagebar"><div class="in">
  <h1>Lịch ôn tập — hướng A + panel ngày</h1>
  <button class="pill" id="today-btn"></button>
  <button class="pill" id="data-btn"></button>
  <span class="spacer"></span>
  <button class="pill" onclick="document.documentElement.classList.toggle('dark')">Sáng / tối</button>
</div></div>

<div class="stage">
  <p class="caption" id="cap"></p>
  <div class="app">
    <div class="side">
      <div class="brand">Recall AI</div>
      <nav class="nav">
        <a href="#"><span class="ic"></span>Tổng quan</a>
        <a href="#" class="on"><span class="ic"></span>Kế hoạch ôn tập</a>
        <a href="#"><span class="ic"></span>Đồ thị khái niệm</a>
        <a href="#"><span class="ic"></span>Focus Session</a>
        <a href="#"><span class="ic"></span>Lịch sử &amp; Tiến độ</a>
        <a href="#"><span class="ic"></span>Hồ sơ</a>
      </nav>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<script>
/* ===== DỮ LIỆU THẬT — mốc 10, luật ① tier truy ngược → ② createdAt mới nhất ===== */
const PLANS=[
 {k:'ktpm',n:'Kiến trúc phần mềm',      dl:'2026-08-20',st:'active'},
 {k:'kttp',n:'Kiểm thử phần mềm',       dl:'2026-09-30',st:'active'},
 {k:'ctdl',n:'Cấu trúc dữ liệu & Giải thuật',dl:'2026-08-15',st:'active'},
 {k:'csdl',n:'Cơ sở dữ liệu',           dl:'2026-09-10',st:'active'},
 {k:'mmt', n:'Mạng máy tính',           dl:'2026-09-15',st:'active'},
 {k:'hdh', n:'Hệ điều hành',            dl:'2026-09-20',st:'active'},
 {k:'ttnt',n:'Trí tuệ nhân tạo',        dl:'2026-10-01',st:'active'},
 {k:'trr', n:'Toán rời rạc',            dl:'2026-08-30',st:'draft'},
 {k:'lth', n:'Lập trình hàm',           dl:'2026-09-05',st:'draft'},
 {k:'ptt', n:'Phân tích thiết kế',      dl:'2026-08-30',st:'archived'},
 {k:'cnpm',n:'Nhập môn CNPM',           dl:'2026-08-30',st:'archived'},
];
const PN=Object.fromEntries(PLANS.map(p=>[p.k,p]));
/* ===== A · DỮ LIỆU DEMO HIỆN TẠI — chép từ `.claude/schedule-handoff/schedule-sample-payload.json`
   (Architect sinh lại SAU khi chạy --apply, khớp DB từng dateKey).
   10 mục · 3 quá hạn · 2 hôm nay · 5 sắp tới. Tên kế hoạch đổi sang tên môn học nghe thật;
   ngày / phút / lý do / tầng / mastery đều là số nguyên bản của payload. ===== */
const DEMO=[
 {d:'2026-08-12',n:'Linked List',          p:'ctdl',r:'sr',min:3, m:0.85},
 {d:'2026-08-15',n:'Binary Tree',          p:'ctdl',r:'sr',min:3, m:0.85},
 {d:'2026-08-17',n:'Array',                p:'ctdl',r:'sr',min:9, m:0.61},
 {d:'2026-08-18',n:'Vòng đời request HTTP',p:'ktpm',r:'tb',dep:1,min:14,m:null,src:'Tầng trình bày'},
 {d:'2026-08-18',n:'Tầng trình bày',       p:'ktpm',r:'sr',min:9, m:0},
 {d:'2026-08-19',n:'Giao diện người dùng', p:'ktpm',r:'tb',dep:1,min:14,m:null,src:'Tầng trình bày'},
 {d:'2026-08-20',n:'Kiến trúc phân lớp',   p:'ktpm',r:'tb',dep:1,min:14,m:0,   src:'Tầng trình bày'},
 {d:'2026-08-22',n:'System testing',       p:'kttp',r:'sr',min:9, m:0},
 {d:'2026-08-24',n:'Integration testing',  p:'kttp',r:'tb',dep:1,min:14,m:null,src:'System testing'},
 {d:'2026-08-27',n:'Component testing',    p:'kttp',r:'tb',dep:2,min:19,m:null,src:'System testing'},
];
/* ===== B · CA TOÀN QUÁ HẠN — dữ liệu trước khi seed. Vẫn là ca CÓ THẬT: nó quay lại nếu ai
   chạy `--restore`, hoặc nếu quên chạy lại script sáng hôm demo. 10 mục, 10 quá hạn, 0 tương lai. ===== */
const OVERDUE=[
 {d:'2026-08-08',n:'Kiến trúc phân lớp',   p:'ktpm',r:'tb',dep:1,min:14,m:0,   src:'Tầng trình bày'},
 {d:'2026-08-08',n:'Vòng đời request HTTP',p:'ktpm',r:'tb',dep:1,min:14,m:null,src:'Tầng trình bày'},
 {d:'2026-08-08',n:'Giao diện người dùng', p:'ktpm',r:'tb',dep:1,min:14,m:null,src:'Tầng trình bày'},
 {d:'2026-08-09',n:'Tầng trình bày',       p:'ktpm',r:'sr',min:9, m:0},
 {d:'2026-08-09',n:'Component testing',    p:'kttp',r:'tb',dep:2,min:19,m:null,src:'System testing'},
 {d:'2026-08-09',n:'Integration testing',  p:'kttp',r:'tb',dep:1,min:14,m:null,src:'System testing'},
 {d:'2026-08-10',n:'System testing',       p:'kttp',r:'sr',min:9, m:0},
 {d:'2026-08-14',n:'Linked List',          p:'ctdl',r:'sr',min:9, m:0.85},
 {d:'2026-08-14',n:'Binary Tree',          p:'ctdl',r:'sr',min:9, m:0.85},
 {d:'2026-08-14',n:'Array',                p:'ctdl',r:'sr',min:9, m:0.61},
];

let TODAY='2026-08-18', OVD=false, VIEW='lich', TAB='active',
    MY=2026, MM=7, SEL=null, OPEN=null, DEBT=false, FOPEN=false,
    OFF=new Set();
const ACT=PLANS.filter(p=>p.st==='active');

const items=()=> (OVD?OVERDUE:DEMO).filter(x=>!OFF.has(x.p));
const dkey=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const onDay=ds=>items().filter(x=>x.d===ds);
const late=ds=>ds<TODAY;
const debtItems=()=>items().filter(x=>late(x.d));
const mcls=m=>m===null?'m-untested':m>=0.8?'m-strong':m>=0.6?'m-learn':'m-weak';
const mtxt=m=>m===null?'chưa kiểm tra':m>=0.8?'đã vững':m>=0.6?'đang học':'yếu';
const MON=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const DW=['CN','T2','T3','T4','T5','T6','T7'];
const dayLabel=ds=>{const dt=new Date(ds+'T00:00:00Z');return `${DW[dt.getUTCDay()]}, ${ds.slice(8)}/${ds.slice(5,7)}`;};
const diffDays=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- panel ---------- */
function itemRow(x,i){
  const open=OPEN===i;
  return `<button class="pitem ${open?'open':''}" onclick="tog(${i})">
    <span class="pl1"><span class="dot ${mcls(x.m)}"></span>
      <span class="nm">${esc(x.n)}</span>
      ${x.r==='tb'?`<span class="badge">Truy ngược · tầng ${x.dep}</span>`:''}</span>
    <span class="pl2"><span class="planlabel">${esc(PN[x.p].n)}</span><span>·</span><span>≈ ${x.min} phút</span></span>
    ${open?`
      <span class="why ${x.r==='sr'?'sr':''}">${x.r==='tb'
        ? `Nền tảng của <a onclick="event.stopPropagation()">‘${esc(x.src)}’</a> mà bạn còn yếu.`
        : `Đến lịch ôn tập theo mức độ ghi nhớ — hiện <b>${mtxt(x.m)}</b>.`}</span>
      <span class="acts">
        <button class="btn pri sm" onclick="event.stopPropagation()">Vào phiên kiểm tra</button>
        <button class="btn sm" onclick="event.stopPropagation()">Học lại</button>
        ${x.r==='tb'
          ? ''
          : `<button class="btn sm" onclick="event.stopPropagation()">Dời sang ngày…</button>`}
        <button class="btn sm" onclick="event.stopPropagation()">Gỡ khỏi lịch</button></span>
      ${x.r==='tb'?`<span class="lock">Không dời được lịch: đây là nền tảng đang vỡ, hệ thống sẽ xếp lại sau mỗi phiên kiểm tra.</span>`:''}
    `:''}
  </button>`;
}
function panel(){
  if(DEBT){
    const list=debtItems().slice().sort((a,b)=>(b.r==='tb')-(a.r==='tb')||a.d.localeCompare(b.d));
    return `<aside class="panel">
      <div class="ph"><div class="r1"><div>
        <h3>Còn nợ</h3>
        <div class="meta"><span class="late">${list.length} khái niệm · ≈ ${list.reduce((s,x)=>s+x.min,0)} phút</span> · quá hạn, không thuộc tháng nào</div>
      </div><button class="px" onclick="DEBT=false;render()">×</button></div></div>
      <div class="plist">${list.length?list.map((x,i)=>itemRow(x,i)).join('')
        :`<div class="pempty">Không còn nợ gì.</div>`}</div></aside>`;
  }
  if(!SEL) return '';
  const list=onDay(SEL), L=late(SEL), isT=SEL===TODAY;
  return `<aside class="panel">
    <div class="ph"><div class="r1"><div>
      <h3>${isT?'Hôm nay':dayLabel(SEL)}</h3>
      <div class="meta">${list.length?`${list.length} khái niệm · ≈ ${list.reduce((s,x)=>s+x.min,0)} phút`:'không có gì được xếp'}
        ${L?` · <span class="late">quá hạn ${diffDays(SEL,TODAY)} ngày</span>`:''}</div>
    </div><button class="px" onclick="SEL=null;OPEN=null;render()">×</button></div></div>
    <div class="plist">${list.length?list.map((x,i)=>itemRow(x,i)).join('')
      :`<div class="pempty">Ngày này trống.<br>Engine chỉ xếp ngày ôn sau mỗi phiên kiểm tra.</div>`}</div></aside>`;
}

/* ---------- lưới ---------- */
function grid(){
  const first=new Date(Date.UTC(MY,MM,1)), start=(first.getUTCDay()+6)%7;
  const cells=[];
  for(let i=0;i<42;i++){
    const dt=new Date(Date.UTC(MY,MM,1-start+i)), ds=dt.toISOString().slice(0,10);
    const out=dt.getUTCMonth()!==MM, list=onDay(ds), L=late(ds)&&list.length;
    const tot=list.reduce((s,x)=>s+x.min,0), show=list.slice(0,3), rest=list.length-show.length;
    cells.push(`<button class="cell ${out?'out':''} ${ds===TODAY?'today':''} ${L?'late':''} ${ds===SEL?'sel':''}"
      ${out?'disabled':`onclick="SEL='${ds}';OPEN=null;DEBT=false;render()"`}>
      <span class="crow"><span class="dnum">${ds.slice(8)}</span>${tot?`<span class="dmin">≈${tot}ʹ</span>`:''}</span>
      ${show.map(x=>`<span class="chip ${x.r==='tb'?'tb':L?'late':''}">${esc(x.n)}</span>`).join('')}
      ${rest>0?`<span class="more">+${rest} mục nữa</span>`:''}
      ${list.length?`<span class="cellmini">${list.slice(0,4).map(x=>`<i class="${x.r==='tb'?'tb':L?'late':''}"></i>`).join('')}${list.length>4?`<b>+${list.length-4}</b>`:''}</span>`:''}
    </button>`);
  }
  const inMonth=items().filter(x=>x.d.startsWith(`${MY}-${String(MM+1).padStart(2,'0')}`)).length;
  const dbt=debtItems().length;
  return `<div class="cal">
    <div class="dow">${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="grid">${cells.join('')}
      ${inMonth?'':`<div class="emptymonth"><div>
        <div class="big">${MON[MM]} chưa có buổi ôn nào</div>
        <div class="sm">${dbt?`Engine chỉ xếp ngày sau mỗi phiên kiểm tra. Bạn còn <b>${dbt} khái niệm quá hạn</b> ở thanh phía trên — xong chúng thì lịch phía trước sẽ đầy lên.`
          :'Engine chỉ xếp ngày ôn sau mỗi phiên kiểm tra. Làm một phiên để có lịch.'}</div></div></div>`}
    </div></div>`;
}

/* ---------- view Lịch ---------- */
function viewLich(){
  const dbt=debtItems(), drafts=PLANS.filter(p=>p.st==='draft');
  const act=PLANS.filter(p=>p.st==='active');
  return `
  ${drafts.length?`<div class="banner"><span><b>${drafts.length} kế hoạch chưa xác nhận đồ thị</b> — chúng chưa có buổi ôn nào trên lịch.</span>
    <a onclick="VIEW='kh';TAB='draft';render()">Xem &amp; xác nhận →</a></div>`:''}

  ${dbt.length
    ? `<button class="debtbar" onclick="DEBT=true;SEL=null;OPEN=null;render()">
        <span class="t">Còn nợ</span>
        <span class="n">${dbt.length} khái niệm · ≈ ${dbt.reduce((s,x)=>s+x.min,0)} phút</span>
        <span class="spacer"></span>
        <span class="d">quá hạn — không thuộc tháng nào · bấm để xem</span></button>`
    : `<div class="debtbar ok"><span class="t">Không nợ gì</span>
        <span class="n">0 khái niệm quá hạn</span></div>`}

  <div class="tools">
    <button class="btn" onclick="const t=new Date(TODAY);MY=t.getUTCFullYear();MM=t.getUTCMonth();render()">Hôm nay</button>
    <button class="btn sm" onclick="MM--;if(MM<0){MM=11;MY--}render()">‹</button>
    <span class="month">${MON[MM]} ${MY}</span>
    <button class="btn sm" onclick="MM++;if(MM>11){MM=0;MY++}render()">›</button>
    <span style="width:10px"></span>
    <span class="filt">
      <button class="${OFF.size?'act':''}" onclick="event.stopPropagation();FOPEN=!FOPEN;render()">
        Kế hoạch <span class="cnt">${act.length-OFF.size}/${act.length}</span> <span class="car">▼</span>
      </button>
      ${FOPEN?`<div class="fmenu" onclick="event.stopPropagation()">
        <div class="fhead"><span>Hiện trên lịch</span>
          <button onclick="${OFF.size?`OFF.clear()`:`OFF=new Set(ACT.map(p=>p.k))`};render()">
            ${OFF.size?'Chọn tất cả':'Bỏ chọn tất cả'}</button></div>
        <div class="flist">${act.map(p=>{const n=(OVD?OVERDUE:DEMO).filter(x=>x.p===p.k).length;
          return `<button class="frow ${OFF.has(p.k)?'':'on'} ${n?'':'zero'}"
            onclick="OFF.has('${p.k}')?OFF.delete('${p.k}'):OFF.add('${p.k}');render()">
            <span class="box"><i class="tick"></i></span>
            <span class="nm">${esc(p.n)}</span><span class="n">${n}</span></button>`}).join('')}</div>
        <div class="fnote">Kế hoạch <b>0 mục</b> vẫn hiện ở đây — chúng chưa có buổi ôn nào, không phải bị ẩn.
          Kế hoạch chưa xác nhận / đã lưu trữ nằm ở view <b>Kế hoạch</b>.</div>
      </div>`:''}
    </span>
  </div>

  <div class="body ${(SEL||DEBT)?'withpanel':''}">${grid()}${panel()}</div>`;
}

/* ---------- view Kế hoạch ---------- */
function viewKH(){
  const g={active:'Đang hoạt động',draft:'Chưa xác nhận',archived:'Đã lưu trữ'};
  const list=PLANS.filter(p=>p.st===TAB);
  return `<div class="tabs">${Object.entries(g).map(([k,v])=>
      `<button class="${TAB===k?'on':''}" onclick="TAB='${k}';render()">${v}<span class="n">${PLANS.filter(p=>p.st===k).length}</span></button>`).join('')}</div>
    <div class="cards">${list.map(p=>{
      const n=(OVD?OVERDUE:DEMO).filter(x=>x.p===p.k).length;
      return `<div class="card">
        <h4>${esc(p.n)}</h4>
        <div class="cm">hạn ${p.dl.slice(8)}/${p.dl.slice(5,7)} · ${p.st==='draft'?'chưa xác nhận đồ thị':`${diffDays(TODAY,p.dl)>0?`còn ${diffDays(TODAY,p.dl)} ngày`:`quá hạn ${-diffDays(TODAY,p.dl)} ngày`}`}</div>
        <div class="bar">${p.st==='active'?`<span style="width:35%;background:var(--mastery-strong)"></span><span style="width:15%;background:var(--mastery-learning)"></span>`:''}</div>
        <div class="cnts"><span><b>${p.st==='draft'?'—':'4'}</b> vững</span><span><b>${p.st==='draft'?'—':'2'}</b> đang học</span>
          <span><b>${p.st==='draft'?'—':'1'}</b> yếu</span><span><b>${p.st==='draft'?'—':'6'}</b> chưa kiểm tra</span></div>
        <div class="cfoot">${p.st==='draft'?'Cần xác nhận đồ thị trước khi vào lịch'
          :n?`Trên lịch · ${n} khái niệm`:'Chưa có buổi ôn nào trên lịch'}</div>
      </div>`}).join('')}</div>`;
}

function tog(i){ OPEN=OPEN===i?null:i; render(); }

function render(){
  document.getElementById('today-btn').textContent=`Hôm nay: ${TODAY.slice(8)}/${TODAY.slice(5,7)} — đổi`;
  document.getElementById('data-btn').textContent= OVD?'Ca: TOÀN QUÁ HẠN':'Dữ liệu demo hiện tại (3/2/5)';
  document.getElementById('data-btn').className='pill'+(OVD?' on':'');
  document.getElementById('cap').innerHTML = OVD
    ? 'Ca <b>TOÀN QUÁ HẠN</b> — 10 mục, 10 quá hạn, 0 hôm nay, 0 tương lai. Đây là trạng thái DB <b>trước khi seed</b>, và nó quay lại nếu ai chạy <code>--restore</code> hoặc quên chạy script sáng hôm demo. Thanh “Còn nợ” gánh toàn bộ nội dung; lưới vẫn <b>nói ra được lý do</b>, không đọc thành “app rỗng”.'
    : 'Ca <b>dữ liệu demo hiện tại</b> (chép từ <code>schedule-sample-payload.json</code>, khớp DB từng <code>dateKey</code>): 10 mục · <b>3 quá hạn · 2 hôm nay · 5 sắp tới</b>, trải cả 3 kế hoạch. Đây là tấm lịch 4 người sẽ build theo.';
  document.getElementById('main').innerHTML=`
    <div class="head"><div style="flex:1">
      <h2>Kế hoạch ôn tập</h2>
      <div class="sub">Lịch gộp mọi kế hoạch đang hoạt động · hôm nay ${TODAY.slice(8)}/${TODAY.slice(5,7)}/2026</div>
    </div><button class="btn pri">+ Tạo kế hoạch mới</button></div>
    <div class="views">
      <button class="${VIEW==='lich'?'on':''}" onclick="VIEW='lich';render()">Lịch</button>
      <button class="${VIEW==='kh'?'on':''}" onclick="VIEW='kh';render()">Kế hoạch</button>
    </div>
    ${VIEW==='lich'?viewLich():viewKH()}`;
  if(FOPEN) fitMenu();
}
/* Kẹp chiều cao dropdown theo chỗ TRỐNG THẬT dưới nút, và lật lên trên khi dưới không đủ.
   `max-height:60vh` không đủ: nó không biết nút đang nằm ở đâu trên màn, nên khi toolbar bị đẩy
   xuống thấp thì menu vẫn thò khỏi đáy (đo được: bottom 778 > viewport 759).
   Bản thật dùng Radix `popover.tsx` (đã có trong repo) — nó tự làm flip/shift, không phải viết tay. */
function fitMenu(){
  const m=document.querySelector('.fmenu'); if(!m) return;
  const btn=m.parentElement.querySelector('button');
  const GAP=8, r=btn.getBoundingClientRect();
  const duoi=innerHeight-r.bottom-GAP, tren=r.top-GAP;
  const lat = duoi<220 && tren>duoi;                 // dưới chật hơn trên ⇒ lật
  m.style.maxHeight=Math.max(160,Math.min(360,lat?tren:duoi))+'px';
  if(lat){ m.style.top='auto'; m.style.bottom='calc(100% + 6px)'; }
  else   { m.style.bottom='auto'; m.style.top='calc(100% + 6px)'; }
}
document.addEventListener('click',()=>{ if(FOPEN){FOPEN=false;render();} });
addEventListener('resize',()=>{ if(FOPEN) fitMenu(); });
document.getElementById('today-btn').onclick=()=>{
  TODAY = TODAY==='2026-08-18' ? '2026-08-23' : '2026-08-18'; SEL=null;OPEN=null;render(); };
document.getElementById('data-btn').onclick=()=>{ OVD=!OVD; SEL=null;OPEN=null;render(); };
render();
</script>
</body></html>
