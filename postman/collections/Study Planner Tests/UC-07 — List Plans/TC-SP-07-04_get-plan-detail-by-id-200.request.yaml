$kind: http-request
name: TC-SP-07-04 — Xem chi tiết 1 plan theo ID → trả về đúng data (200)
url: '{{baseURL}}/api/v1/study-plans/{{planId}}'
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-07-04: Status code là 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('TC-SP-07-04: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-07-04: data.plan.id khớp với planId', function () {
        pm.expect(body.data.plan.id).to.equal(pm.environment.get('planId'));
      });
      pm.test('TC-SP-07-04: data.plan có id, name, deadline, status, createdAt', function () {
        pm.expect(body.data.plan).to.include.all.keys('id', 'name', 'deadline', 'status', 'createdAt');
      });
      pm.test('TC-SP-07-04: data.plan.status = active', function () { pm.expect(body.data.plan.status).to.equal('active'); });
      pm.test('TC-SP-07-04: data.concepts là mảng với id, name, difficulty, mastery_score', function () {
        pm.expect(body.data.concepts).to.be.an('array').and.not.empty;
        body.data.concepts.forEach(c => pm.expect(c).to.include.all.keys('id', 'name', 'difficulty', 'mastery_score'));
      });
      pm.test('TC-SP-07-04: data.edges là mảng với from, to', function () {
        pm.expect(body.data.edges).to.be.an('array');
        body.data.edges.forEach(e => pm.expect(e).to.include.all.keys('from', 'to'));
      });
    language: text/javascript
order: 4000
