$kind: http-request
name: TC-SP-07-04 — Xem chi tiết 1 plan theo ID → trả về đúng data (200)
url: '{{baseURL}}/api/v1/plans/{{planId}}'
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-07-04: Status code là 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('TC-SP-07-04: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-07-04: data.plan.id khớp với planId', function () {
        pm.expect(body.data.id).to.equal(pm.environment.get('planId'));
      });
      pm.test('TC-SP-07-04: data.plan có id, name, deadline, status, createdAt', function () {
        pm.expect(body.data).to.include.all.keys('id', 'name', 'deadline', 'status', 'createdAt');
      });
      pm.test('TC-SP-07-04: data.plan.status = draft', function () { pm.expect(body.data.status).to.equal('draft'); });
      pm.test('TC-SP-07-04: data.concepts là mảng (có thể rỗng khi đang draft)', function () {
        pm.expect(body.data.concepts).to.be.an('array');
      });
      pm.test('TC-SP-07-04: data.edges là mảng', function () {
        pm.expect(body.data.edges).to.be.an('array');
      });
    language: text/javascript
order: 4000
