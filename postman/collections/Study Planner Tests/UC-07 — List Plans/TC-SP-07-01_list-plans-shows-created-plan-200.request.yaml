$kind: http-request
name: TC-SP-07-01 — Xem danh sách plans → hiển thị đúng plan vừa tạo (200)
url: '{{baseURL}}/api/v1/study-plans'
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-07-01: Status code là 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('TC-SP-07-01: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-07-01: data.plans là mảng', function () { pm.expect(body.data.plans).to.be.an('array'); });
      pm.test('TC-SP-07-01: plan vừa tạo xuất hiện trong danh sách', function () {
        const planId = pm.environment.get('planId');
        const found = body.data.plans.find(p => p.id === planId);
        pm.expect(found).to.not.be.undefined;
      });
      pm.test('TC-SP-07-01: plan có đầy đủ trường id, name, deadline, status, createdAt', function () {
        const planId = pm.environment.get('planId');
        const plan = body.data.plans.find(p => p.id === planId);
        pm.expect(plan).to.include.all.keys('id', 'name', 'deadline', 'status', 'createdAt');
      });
      pm.test('TC-SP-07-01: plan.status = active', function () {
        const planId = pm.environment.get('planId');
        const plan = body.data.plans.find(p => p.id === planId);
        pm.expect(plan.status).to.equal('active');
      });
      pm.test('TC-SP-07-01: plan.deadline là ISO 8601 hợp lệ', function () {
        const planId = pm.environment.get('planId');
        const plan = body.data.plans.find(p => p.id === planId);
        pm.expect(new Date(plan.deadline).toString()).to.not.equal('Invalid Date');
      });
    language: text/javascript
order: 1000
