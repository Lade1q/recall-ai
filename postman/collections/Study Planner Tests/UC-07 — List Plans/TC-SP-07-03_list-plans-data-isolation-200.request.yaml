$kind: http-request
name: TC-SP-07-03 — Danh sách chỉ chứa plan của user hiện tại — cách ly dữ liệu (200)
url: '{{baseURL}}/api/v1/study-plans'
method: GET
headers:
  Authorization: Bearer {{userBToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-07-03: Status code là 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('TC-SP-07-03: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-07-03: data.plans là mảng', function () { pm.expect(body.data.plans).to.be.an('array'); });
      pm.test('TC-SP-07-03: planId_A của User A không xuất hiện trong response của User B', function () {
        const planIdA = pm.environment.get('planIdA');
        const found = body.data.plans.find(p => p.id === planIdA);
        pm.expect(found).to.be.undefined;
      });
      pm.test('TC-SP-07-03: Tất cả plans trong response đều thuộc userBId', function () {
        const userBId = pm.environment.get('userBId');
        if (userBId) {
          body.data.plans.forEach(p => pm.expect(p.userId).to.equal(userBId));
        }
      });
    language: text/javascript
order: 3000
