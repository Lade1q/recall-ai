$kind: http-request
name: TC-SP-05-14 — Tạo plan thành công khi nhập văn bản trực tiếp (A3) (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Ôn thi Lập trình Python",
      "deadline": "2026-12-31",
      "content": "Khóa học gồm các chủ đề: biến và kiểu dữ liệu, vòng lặp for và while, hàm và đệ quy, danh sách và từ điển, xử lý file và ngoại lệ."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-14: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-14: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-14: data.plan.id tồn tại', function () { pm.expect(body.data.plan.id).to.be.a('string').and.not.empty; });
      pm.test('TC-SP-05-14: data.plan.status = active', function () { pm.expect(body.data.plan.status).to.equal('active'); });
      pm.test('TC-SP-05-14: data.plan.concepts là mảng không rỗng', function () { pm.expect(body.data.plan.concepts).to.be.an('array').and.not.empty; });
    language: text/javascript
order: 14000
