$kind: http-request
name: TC-SP-05-05 — AI trả JSON hợp lệ → concepts và edges lưu DB đúng (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Lập trình Hướng đối tượng
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-05: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-05: success = true', function () { pm.expect(body.success).to.be.true; });

      const planId = body.data?.plan?.id;
      if (planId) {
          pm.collectionVariables.set("createdPlanId", planId);
          pm.test("TC-SP-05-05: Background job processed correctly (Active state)", function (done) {
              setTimeout(function() {
                  const getOptions = {
                      url: pm.variables.get("baseURL") + "/api/v1/plans/" + planId,
                      method: "GET",
                      header: { "Authorization": pm.request.headers.get("Authorization") }
                  };
                  pm.sendRequest(getOptions, function (err, res) {
                      if (err) return done(err);
                      try {
                          pm.expect(res.code).to.equal(200);
                          const getBody = res.json();
                          pm.expect(getBody.data.status).to.equal("active");
                          pm.expect(getBody.data.concepts).to.be.an('array').with.lengthOf(5);
                          const names = getBody.data.concepts.map(c => c.name);
                          pm.expect(names).to.include.members(['Variable', 'Loop', 'Array', 'Recursion', 'Sorting']);
                          done();
                      } catch (e) {
                          done(e);
                      }
                  });
              }, 1500);
          });
      }
    language: text/javascript
order: 5000
