$kind: http-request
name: TC-SP-05-11b — Tạo plan thất bại khi file PDF có mật khẩu (400)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Hóa học (Protected PDF)
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/protected.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-11b: Status code là 201', function () {
        pm.expect(pm.response.code).to.equal(201);
      });
      const body = pm.response.json();
      pm.test('TC-SP-05-11b: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-11b: status = draft', function () {
        pm.expect(body.data.plan.status).to.equal('draft');
      });
    language: text/javascript
order: 11100
