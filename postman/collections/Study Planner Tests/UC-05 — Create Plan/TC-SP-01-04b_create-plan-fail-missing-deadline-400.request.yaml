$kind: http-request
name: TC-SP-01-04b — Thiếu `deadline` → 400 VALIDATION_ERROR
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Toán
    - key: file
      src: sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      // TC-SP-01-04b: Thiếu field `deadline` → ZodError → errorHandler trả 400 VALIDATION_ERROR
      pm.test('TC-SP-01-04b: Status code là 400 Bad Request', function () {
        pm.response.to.have.status(400);
      });

      const body = pm.response.json();

      pm.test('TC-SP-01-04b: success = false', function () {
        pm.expect(body.success).to.be.false;
      });

      pm.test('TC-SP-01-04b: error.code = "VALIDATION_ERROR"', function () {
        pm.expect(body.error.code).to.equal('VALIDATION_ERROR');
      });

      pm.test('TC-SP-01-04b: error.details chứa lỗi trường "deadline"', function () {
        const details = body.error.details;
        pm.expect(details).to.be.an('array').that.is.not.empty;
        const deadlineError = details.find(d => d.path && d.path.includes('deadline'));
        pm.expect(deadlineError).to.not.be.undefined;
      });
    language: text/javascript
order: 4100
