$kind: http-request
name: TC-SP-05-04e — Tạo plan thất bại khi name là chuỗi rỗng (400)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: ''
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-04e: Status code là 400 (name = chuỗi rỗng)', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-SP-05-04e: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-04e: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-SP-05-04e: error đề cập trường name', function () {
        const details = JSON.stringify(body.error.details || body.error.message || '').toLowerCase();
        pm.expect(details).to.include('name');
      });
    language: text/javascript
order: 4500
