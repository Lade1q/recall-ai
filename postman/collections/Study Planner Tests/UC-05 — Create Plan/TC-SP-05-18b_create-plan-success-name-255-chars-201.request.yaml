$kind: http-request
name: TC-SP-05-18b — Tạo plan thành công với name đúng 255 ký tự (201)
url: '{{baseURL}}/api/v1/study-plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-18b: Status code là 201 Created (name = 255 ký tự đúng giới hạn)', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-18b: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-18b: data.plan.name có 255 ký tự', function () {
        pm.expect(body.data.plan.name.length).to.equal(255);
      });
    language: text/javascript
order: 18200
