$kind: http-request
name: TC-SP-05-15 — AI trả JSON hợp lệ nhưng concepts rỗng (Edge case) (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Edge Case
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-15: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-15: data.plan.status = draft', function () { pm.expect(body.data.plan.status).to.equal('draft'); });
      pm.test('TC-SP-05-15: data.plan.concepts chưa có', function () {
        if (body.data.plan.concepts) {
          pm.expect(body.data.plan.concepts).to.be.an('array').that.is.empty;
        } else {
          pm.expect(body.data.plan.concepts).to.be.undefined;
        }
      });
    language: text/javascript
order: 15000
