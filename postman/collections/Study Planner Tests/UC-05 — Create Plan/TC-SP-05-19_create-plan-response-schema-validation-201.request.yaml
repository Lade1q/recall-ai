$kind: http-request
name: TC-SP-05-19 — Tạo plan thành công — Validate toàn bộ response schema (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Schema Validation Test
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-19: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-19: success là boolean true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-19: data.plan.id là UUID hợp lệ', function () {
        pm.expect(body.data.plan.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i);
      });
      pm.test('TC-SP-05-19: data.plan.name khớp input', function () { pm.expect(body.data.plan.name).to.equal('Schema Validation Test'); });
      pm.test('TC-SP-05-19: data.plan.deadline là chuỗi ISO 8601', function () {
        pm.expect(body.data.plan.deadline).to.be.a('string');
        pm.expect(new Date(body.data.plan.deadline).toString()).to.not.equal('Invalid Date');
      });
      pm.test('TC-SP-05-19: data.plan.status = draft', function () { pm.expect(body.data.plan.status).to.equal('draft'); });
      pm.test('TC-SP-05-19: data.plan.createdAt là ISO 8601', function () {
        pm.expect(new Date(body.data.plan.createdAt).toString()).to.not.equal('Invalid Date');
      });
      pm.test('TC-SP-05-19: data.plan.userId tồn tại', function () {
        pm.expect(body.data.plan.userId).to.be.a('string').and.not.empty;
      });
      pm.test('TC-SP-05-19: concepts array is draft', function () {
        if (body.data.plan.concepts) {
          pm.expect(body.data.plan.concepts).to.be.an('array');
        } else {
          pm.expect(body.data.plan.concepts).to.be.undefined;
        }
      });
      pm.test('TC-SP-05-19: response không lộ passwordHash', function () {
        pm.expect(JSON.stringify(body)).to.not.include('passwordHash');
      });
    language: text/javascript
order: 19000
