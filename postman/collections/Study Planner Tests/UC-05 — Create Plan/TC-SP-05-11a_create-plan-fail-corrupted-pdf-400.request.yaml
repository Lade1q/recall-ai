$kind: http-request
name: TC-SP-05-11a — Tạo plan thất bại khi file PDF bị hỏng (400)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Hóa học
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: corrupted.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-11: Status code là 400 hoặc 422', function () {
        pm.expect([400, 422]).to.include(pm.response.code);
      });
      const body = pm.response.json();
      pm.test('TC-SP-05-11: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-11: error.code là FILE_CORRUPTED hoặc FILE_UNREADABLE', function () {
        pm.expect(['FILE_CORRUPTED', 'FILE_UNREADABLE']).to.include(body.error.code);
      });
      pm.test('TC-SP-05-11: error.message tồn tại', function () { pm.expect(body.error.message).to.be.a('string').and.not.empty; });
    language: text/javascript
order: 11000
