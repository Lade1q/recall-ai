$kind: http-request
name: TC-SP-05-10 — Tạo plan thất bại khi không có file hoặc text đầu vào (400)
url: '{{baseURL}}/api/v1/study-plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - key: name
      value: Ôn thi Vật lý
    - key: deadline
      value: '2026-12-31'
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-10: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-SP-05-10: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-10: error.code là VALIDATION_ERROR hoặc CONTENT_REQUIRED', function () {
        pm.expect(['VALIDATION_ERROR', 'CONTENT_REQUIRED']).to.include(body.error.code);
      });
      pm.test('TC-SP-05-10: error.details nêu yêu cầu cung cấp nội dung', function () { pm.expect(body.error.message).to.be.a('string').and.not.empty; });
    language: text/javascript
order: 10000
