$kind: http-request
name: TC-SP-05-07 — AI tạo cycle → DAG validation loại bỏ + cảnh báo (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Đại số tuyến tính
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-07: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-07: success = true', function () { pm.expect(body.success).to.be.true; });

      const planId = body.data?.plan?.id;
      if (planId) {
          pm.test("TC-SP-05-07: Background job fixes DAG cycle (dagAutoFixed = true)", function (done) {
              setTimeout(function() {
                  const getOptions = {
                      url: pm.variables.get("baseURL") + "/api/v1/plans/" + planId,
                      method: "GET",
                      header: { "Authorization": pm.request.headers.get("Authorization") }
                  };
                  pm.sendRequest(getOptions, function (err, res) {
                      if (err) return done(err);
                      try {
                          pm.expect(res.code).to.equal(200);
                          const getBody = res.json();
                          pm.expect(getBody.data.analysisStatus).to.equal("done");
                          pm.expect(getBody.data.dagAutoFixed).to.be.true;
                          
                          // topological check
                          const concepts = getBody.data.concepts || [];
                          const edges = getBody.data.edges || [];
                          const prereqMap = {};
                          concepts.forEach(c => { prereqMap[c.id] = []; });
                          edges.forEach(e => {
                              if (prereqMap[e.toConceptId]) {
                                  prereqMap[e.toConceptId].push(e.fromConceptId);
                              }
                          });
                          function hasCycle(nodeId, visited, recStack) {
                              visited[nodeId] = true; recStack[nodeId] = true;
                              for (const p of prereqMap[nodeId] || []) {
                                  if (!visited[p] && hasCycle(p, visited, recStack)) return true;
                                  if (recStack[p]) return true;
                              }
                              recStack[nodeId] = false; return false;
                          }
                          const visited = {}, recStack = {};
                          const cycleFound = concepts.some(c => !visited[c.id] && hasCycle(c.id, visited, recStack));
                          pm.expect(cycleFound).to.be.false;
                          
                          done();
                      } catch (e) {
                          done(e);
                      }
                  });
              }, 1500);
          });
      }
    language: text/javascript
order: 7000
