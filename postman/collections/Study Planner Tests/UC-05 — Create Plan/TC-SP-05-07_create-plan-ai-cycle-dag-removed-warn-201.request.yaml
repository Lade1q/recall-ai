$kind: http-request
name: TC-SP-05-07 — AI tạo cycle → DAG validation loại bỏ + cảnh báo (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Đại số tuyến tính
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-07: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-07: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-07: data.warnings là mảng không rỗng', function () { pm.expect(body.data.warnings).to.be.an('array').and.not.empty; });
      pm.test('TC-SP-05-07: warning message đề cập chu trình', function () {
        const msg = body.data.warnings[0].message || '';
        pm.expect(msg).to.include('chu trình');
      });
      pm.test('TC-SP-05-07: data.plan.concepts không có cycle (topological check)', function () {
        const concepts = body.data.plan.concepts;
        // Build adjacency and verify no prerequisite creates a cycle
        const prereqMap = {};
        concepts.forEach(c => { prereqMap[c.id] = c.prerequisites || []; });
        function hasCycle(nodeId, visited, recStack) {
          visited[nodeId] = true; recStack[nodeId] = true;
          for (const p of prereqMap[nodeId] || []) {
            if (!visited[p] && hasCycle(p, visited, recStack)) return true;
            if (recStack[p]) return true;
          }
          recStack[nodeId] = false; return false;
        }
        const visited = {}, recStack = {};
        const cycleFound = concepts.some(c => !visited[c.id] && hasCycle(c.id, visited, recStack));
        pm.expect(cycleFound).to.be.false;
      });
    language: text/javascript
order: 7000
