$kind: http-request
name: TC-SP-05-04d — Tạo plan thất bại khi body hoàn toàn rỗng (400)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-04d: Status code là 400 (body rỗng)', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-SP-05-04d: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-04d: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-SP-05-04d: error.details tồn tại', function () {
        pm.expect(body.error.details || body.error.message).to.exist;
      });
    language: text/javascript
order: 4400
