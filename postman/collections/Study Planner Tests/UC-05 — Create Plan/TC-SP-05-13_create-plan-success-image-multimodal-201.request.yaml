$kind: http-request
name: TC-SP-05-13 — Tạo plan thành công với file ảnh (Multimodal — A2) (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Sinh học (ảnh giáo trình)
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: lecture_page.jpg
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-13: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-13: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-13: data.plan.id tồn tại', function () { pm.expect(body.data.plan.id).to.be.a('string').and.not.empty; });
      pm.test('TC-SP-05-13: data.plan.status = active', function () { pm.expect(body.data.plan.status).to.equal('active'); });
      pm.test('TC-SP-05-13: data.plan.concepts là mảng không rỗng', function () { pm.expect(body.data.plan.concepts).to.be.an('array').and.not.empty; });
    language: text/javascript
order: 13000
