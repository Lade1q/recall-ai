$kind: http-request
name: TC-SP-05-04b — Tạo plan thất bại khi thiếu trường deadline (400)
url: '{{baseURL}}/api/v1/study-plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - key: name
      value: Ôn Toán
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-04b: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-SP-05-04b: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-04b: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-SP-05-04b: error.details đề cập trường deadline', function () {
        const details = JSON.stringify(body.error.details || body.error.message || '');
        pm.expect(details.toLowerCase()).to.include('deadline');
      });
    language: text/javascript
order: 4200
