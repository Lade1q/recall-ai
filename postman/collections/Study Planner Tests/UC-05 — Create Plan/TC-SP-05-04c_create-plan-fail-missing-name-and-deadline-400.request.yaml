$kind: http-request
name: TC-SP-05-04c — Tạo plan thất bại khi thiếu cả name và deadline (400)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-04c: Status code là 400 (thiếu cả name và deadline)', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-SP-05-04c: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-04c: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-SP-05-04c: error.details đề cập name và deadline', function () {
        const details = JSON.stringify(body.error.details || body.error.message || '').toLowerCase();
        pm.expect(details).to.satisfy(d => d.includes('name') || d.includes('deadline'));
      });
    language: text/javascript
order: 4300
