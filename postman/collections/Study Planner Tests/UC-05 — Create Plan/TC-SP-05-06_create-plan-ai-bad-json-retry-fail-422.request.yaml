$kind: http-request
name: TC-SP-05-06 — AI trả JSON sai format → retry → fail → báo lỗi (422)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Mạng máy tính
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-06: Status code là 201 Created', function () {
        pm.response.to.have.status(201);
      });
      const body = pm.response.json();
      pm.test('TC-SP-05-06: success = true (synchronous)', function () { pm.expect(body.success).to.be.true; });

      const planId = body.data?.plan?.id;
      if (planId) {
          pm.test("TC-SP-05-06: Background job fails after retries", function (done) {
              setTimeout(function() {
                  const getOptions = {
                      url: pm.variables.get("baseURL") + "/api/v1/plans/" + planId,
                      method: "GET",
                      header: { "Authorization": pm.request.headers.get("Authorization") }
                  };
                  pm.sendRequest(getOptions, function (err, res) {
                      if (err) return done(err);
                      try {
                          pm.expect(res.code).to.equal(200);
                          const getBody = res.json();
                          pm.expect(getBody.data.analysisStatus).to.equal("failed");
                          done();
                      } catch (e) {
                          done(e);
                      }
                  });
              }, 4500); // Wait longer because retry logic has exponential backoff (2s + 4s...)
          });
      }
    language: text/javascript
order: 6000
