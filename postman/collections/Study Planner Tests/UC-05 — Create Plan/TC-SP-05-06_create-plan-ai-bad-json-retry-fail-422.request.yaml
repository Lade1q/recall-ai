$kind: http-request
name: TC-SP-05-06 — AI trả JSON sai format → retry → fail → báo lỗi (422)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Mạng máy tính
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-06: Status code là 422 hoặc 500', function () {
        pm.expect([422, 500]).to.include(pm.response.code);
      });
      const body = pm.response.json();
      pm.test('TC-SP-05-06: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-06: error.code = AI_EXTRACTION_FAILED', function () { pm.expect(body.error.code).to.equal('AI_EXTRACTION_FAILED'); });
      pm.test('TC-SP-05-06: error.message hướng dẫn thử lại', function () { pm.expect(body.error.message).to.be.a('string').and.not.empty; });
    language: text/javascript
order: 6000
