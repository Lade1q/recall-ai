$kind: http-request
name: TC-SP-05-08 — Tạo plan thất bại khi AI Service timeout / quota hết (503)
url: '{{baseURL}}/api/v1/study-plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Sinh học
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-08: Status code là 503 hoặc 504', function () {
        pm.expect([503, 504]).to.include(pm.response.code);
      });
      const body = pm.response.json();
      pm.test('TC-SP-05-08: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-08: error.code là AI_SERVICE_TIMEOUT hoặc AI_SERVICE_UNAVAILABLE', function () {
        pm.expect(['AI_SERVICE_TIMEOUT', 'AI_SERVICE_UNAVAILABLE']).to.include(body.error.code);
      });
      pm.test('TC-SP-05-08: error.message tồn tại', function () { pm.expect(body.error.message).to.be.a('string').and.not.empty; });
    language: text/javascript
order: 8000
