$kind: http-request
name: TC-SP-05-04f — Tạo plan thất bại khi deadline là chuỗi rỗng (400)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Toán
    - type: text
      key: deadline
      value: ''
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-04f: Status code là 400 (deadline = chuỗi rỗng)', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-SP-05-04f: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-04f: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-SP-05-04f: error đề cập trường deadline', function () {
        const details = JSON.stringify(body.error.details || body.error.message || '').toLowerCase();
        pm.expect(details).to.include('deadline');
      });
    language: text/javascript
order: 4600
