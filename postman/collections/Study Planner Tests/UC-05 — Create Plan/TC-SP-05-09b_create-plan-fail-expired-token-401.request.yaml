$kind: http-request
name: TC-SP-05-09b — Tạo plan thất bại khi token hết hạn (401)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{expiredToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Vật lý
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-09b: Status code là 401 Unauthorized', function () { pm.response.to.have.status(401); });
      const body = pm.response.json();
      pm.test('TC-SP-05-09b: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-SP-05-09b: error.code là TOKEN_EXPIRED hoặc UNAUTHORIZED', function () {
        pm.expect(['TOKEN_EXPIRED', 'UNAUTHORIZED']).to.include(body.error.code);
      });
    language: text/javascript
order: 9200
