$kind: http-request
name: TC-SP-05-01 — Tạo plan thành công với file PDF hợp lệ (201)
url: '{{baseURL}}/api/v1/plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Ôn thi Cấu trúc Dữ liệu
    - type: text
      key: deadline
      value: '2026-12-31'
    - key: file
      src: /home/minhphat/workspace/planning-ai/planning-ai/postman/test-data/TC-SP-Studyplanner/sample_lecture.pdf
      type: file
      contentType: application/pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-05-01: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-05-01: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-05-01: data.plan.id tồn tại', function () { pm.expect(body.data.plan.id).to.be.a('string').and.not.empty; });
      pm.test('TC-SP-05-01: data.plan.status = draft', function () { pm.expect(body.data.plan.status).to.equal('draft'); });
      pm.test('TC-SP-05-01: data.plan.name khớp input', function () { pm.expect(body.data.plan.name).to.equal('Ôn thi Cấu trúc Dữ liệu'); });
      pm.test('TC-SP-05-01: data.plan.concepts chưa có (hoặc mảng rỗng do đang tạo draft)', function () { 
        if (body.data.plan.concepts) {
          pm.expect(body.data.plan.concepts).to.be.an('array').that.is.empty;
        } else {
          pm.expect(body.data.plan.concepts).to.be.undefined;
        }
      });
      if (body.data && body.data.plan && body.data.plan.id) {
          pm.environment.set('planId', body.data.plan.id);
          console.log('✅ Auto-saved planId:', body.data.plan.id);
      }
    language: text/javascript
order: 1000
