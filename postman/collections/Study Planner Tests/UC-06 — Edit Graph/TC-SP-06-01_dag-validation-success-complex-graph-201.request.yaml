$kind: http-request
name: TC-SP-06-01 — DAG validation thành công với đồ thị hợp lệ phức tạp (201)
url: '{{baseURL}}/api/v1/study-plans'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - key: name
      value: Lập trình C (DAG 10 nodes)
    - key: deadline
      value: '2026-12-31'
    - key: file
      src: sample_lecture.pdf
      type: file
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-06-01: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-SP-06-01: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-06-01: Không có warnings về cycle', function () {
        const warnings = body.data.warnings || [];
        const hasCycleWarning = warnings.some(w => (w.message || '').includes('chu trình'));
        pm.expect(hasCycleWarning).to.be.false;
      });
      pm.test('TC-SP-06-01: data.plan.concepts có 10 phần tử', function () {
        pm.expect(body.data.plan.concepts).to.be.an('array').with.lengthOf(10);
      });
      pm.test('TC-SP-06-01: Topological sort xác nhận không có cycle', function () {
        const concepts = body.data.plan.concepts;
        const inDegree = {}, adj = {};
        concepts.forEach(c => {
          inDegree[c.id] = inDegree[c.id] || 0;
          adj[c.id] = [];
          (c.prerequisites || []).forEach(pid => {
            adj[pid] = adj[pid] || [];
            adj[pid].push(c.id);
            inDegree[c.id]++;
          });
        });
        const queue = Object.keys(inDegree).filter(n => inDegree[n] === 0);
        let visited = 0;
        while (queue.length) {
          const node = queue.shift(); visited++;
          (adj[node] || []).forEach(nb => { if (--inDegree[nb] === 0) queue.push(nb); });
        }
        pm.expect(visited).to.equal(concepts.length);
      });
    language: text/javascript
order: 1000
