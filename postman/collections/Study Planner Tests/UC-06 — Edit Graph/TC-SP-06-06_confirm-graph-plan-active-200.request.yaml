$kind: http-request
name: TC-SP-06-06 — Xác nhận & Lưu đồ thị → plan chuyển draft → active (200)
url: '{{baseURL}}/api/v1/plans/{{planId}}/confirm'
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-SP-06-06: Status code là 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('TC-SP-06-06: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-SP-06-06: data.plan.status = active', function () { pm.expect(body.data.plan.status).to.equal('active'); });
      pm.test('TC-SP-06-06: data.plan.id khớp với planId', function () {
        pm.expect(body.data.plan.id).to.equal(pm.environment.get('planId'));
      });
      pm.test('TC-SP-06-06: data.concepts là mảng không rỗng', function () {
        pm.expect(body.data.concepts).to.be.an('array').and.not.empty;
      });
    language: text/javascript
order: 6000
