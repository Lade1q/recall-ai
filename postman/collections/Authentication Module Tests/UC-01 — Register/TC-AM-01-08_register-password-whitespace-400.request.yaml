$kind: http-request
name: TC-AM-01-08 — Register thất bại — Password chỉ là khoảng trắng (400)
url: '{{baseURL}}/api/v1/auth/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "spacepass@example.com",
      "password": "        ",
      "name": "Space Test"
    }
scripts:
  - type: afterResponse
    code: |-
      // Edge case / Security test: password 8 spaces — hệ thống nên reject
      // Nếu hệ thống accept (201), tạo bug report về security weakness
      pm.test('TC-AM-01-08: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-AM-01-08: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-01-08: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
    language: text/javascript
order: 8000
