$kind: http-request
name: TC-AM-01-05a — Register thất bại — Thiếu email (400)
url: '{{baseURL}}/api/v1/auth/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "password": "SecurePass1",
      "name": "Test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-01-05a: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-AM-01-05a: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-01-05a: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-AM-01-05a: error.details chỉ rõ trường email bị thiếu', function () { pm.expect(body.error.details).to.be.an('array').and.not.empty; });
    language: text/javascript
order: 5100
