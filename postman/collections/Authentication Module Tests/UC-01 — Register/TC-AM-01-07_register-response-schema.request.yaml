$kind: http-request
name: TC-AM-01-07 — Register thành công — Validate response schema (201)
url: '{{baseURL}}/api/v1/auth/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "schema@example.com",
      "password": "SecurePass1",
      "name": "Schema Test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-01-07: Status code là 201 Created', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.test('TC-AM-01-07: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-AM-01-07: data.user có các trường bắt buộc: id, email, name', function () { pm.expect(body.data.user).to.include.all.keys('id', 'email', 'name'); });
      pm.test('TC-AM-01-07: data.user.password KHÔNG tồn tại', function () { pm.expect(body.data.user).to.not.have.property('password'); });
      pm.test('TC-AM-01-07: data.user.passwordHash KHÔNG tồn tại', function () { pm.expect(body.data.user).to.not.have.property('passwordHash'); });
      pm.test('TC-AM-01-07: accessToken là JWT hợp lệ (3 phần)', function () { pm.expect(body.data.accessToken.split('.')).to.have.lengthOf(3); });
      pm.test('TC-AM-01-07: refreshToken là JWT hợp lệ (3 phần)', function () { pm.expect(body.data.refreshToken.split('.')).to.have.lengthOf(3); });
    language: text/javascript
order: 7000
