$kind: http-request
name: TC-AM-01-05c — Register thất bại — Thiếu name (400)
url: '{{baseURL}}/api/v1/auth/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "test@example.com",
      "password": "SecurePass1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-01-05c: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-AM-01-05c: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-01-05c: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-AM-01-05c: error.details chỉ rõ trường name bị thiếu', function () { pm.expect(body.error.details).to.be.an('array').and.not.empty; });
    language: text/javascript
order: 5300
