$kind: http-request
name: TC-AM-02-03 — Login thất bại — Email không tồn tại (401)
url: '{{baseURL}}/api/v1/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "notexist@example.com",
      "password": "SomePassword1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-02-03: Status code là 401 Unauthorized', function () { pm.response.to.have.status(401); });
      const body = pm.response.json();
      pm.test('TC-AM-02-03: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-02-03: error.code = UNAUTHORIZED', function () { pm.expect(body.error.code).to.equal('UNAUTHORIZED'); });
      // CRITICAL SECURITY CHECK: message phải giống hệt TC-AM-02-02 để ngăn User Enumeration Attack
      pm.test('TC-AM-02-03: error.message giống TC-AM-02-02 (Anti User Enumeration)', function () { pm.expect(body.error.message).to.equal('Email or password incorrect'); });
      pm.test('TC-AM-02-03: response KHÔNG chứa accessToken', function () { pm.expect(body).to.not.have.nested.property('data.accessToken'); });
    language: text/javascript
order: 3000
