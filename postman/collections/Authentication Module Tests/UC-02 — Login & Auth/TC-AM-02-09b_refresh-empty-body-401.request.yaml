$kind: http-request
name: TC-AM-02-09b — Refresh Token thất bại — Body rỗng (401)
url: '{{baseURL}}/api/v1/auth/refresh'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-02-09b: Status code là 401 Unauthorized', function () { pm.response.to.have.status(401); });
      const body = pm.response.json();
      pm.test('TC-AM-02-09b: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-02-09b: error.code = UNAUTHORIZED', function () { pm.expect(body.error.code).to.equal('UNAUTHORIZED'); });
    language: text/javascript
order: 9200
