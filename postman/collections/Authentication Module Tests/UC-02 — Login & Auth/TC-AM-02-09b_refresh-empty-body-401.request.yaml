$kind: http-request
name: TC-AM-02-09b — Refresh Token thất bại — Thiếu field refreshToken (400)
url: '{{baseURL}}/api/v1/auth/refresh'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-02-09b: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-AM-02-09b: success = false', function () { pm.expect(body.success).to.be.false; });
