$kind: http-request
name: TC-AM-02-02 — Login thất bại — Sai password (401)
url: '{{baseURL}}/api/v1/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "logintest@example.com",
      "password": "WrongPassword"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-02-02: Status code là 401 Unauthorized', function () { pm.response.to.have.status(401); });
      const body = pm.response.json();
      pm.test('TC-AM-02-02: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-02-02: error.code = UNAUTHORIZED', function () { pm.expect(body.error.code).to.equal('UNAUTHORIZED'); });
      pm.test('TC-AM-02-02: error.message = "Email or password incorrect"', function () { pm.expect(body.error.message).to.equal('Email or password incorrect'); });
      pm.test('TC-AM-02-02: response KHÔNG chứa accessToken', function () { pm.expect(body).to.not.have.nested.property('data.accessToken'); });
    language: text/javascript
order: 2000
