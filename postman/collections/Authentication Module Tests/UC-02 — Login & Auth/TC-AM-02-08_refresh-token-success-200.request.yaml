$kind: http-request
name: TC-AM-02-08 — Refresh Token thành công (200)
url: '{{baseURL}}/api/v1/auth/refresh'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-02-08: Status code là 200 OK', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('TC-AM-02-08: success = true', function () { pm.expect(body.success).to.be.true; });
      pm.test('TC-AM-02-08: accessToken mới tồn tại và không rỗng', function () { pm.expect(body.data.accessToken).to.be.a('string').and.not.empty; });
      pm.test('TC-AM-02-08: accessToken mới khác accessToken cũ', function () {
          const oldToken = pm.environment.get('accessToken');
          pm.expect(body.data.accessToken).to.not.equal(oldToken);
      });
      if (body.data && body.data.accessToken) {
          pm.environment.set('accessToken', body.data.accessToken);
          console.log('✅ accessToken updated in environment');
      }
    language: text/javascript
order: 8000
