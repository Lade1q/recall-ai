$kind: http-request
name: TC-AM-02-06a — Login thất bại — Thiếu password (400)
url: '{{baseURL}}/api/v1/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "logintest@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AM-02-06a: Status code là 400 Bad Request', function () { pm.response.to.have.status(400); });
      const body = pm.response.json();
      pm.test('TC-AM-02-06a: success = false', function () { pm.expect(body.success).to.be.false; });
      pm.test('TC-AM-02-06a: error.code = VALIDATION_ERROR', function () { pm.expect(body.error.code).to.equal('VALIDATION_ERROR'); });
      pm.test('TC-AM-02-06a: error.details chỉ rõ trường password bị thiếu', function () { pm.expect(body.error.details).to.be.an('array').and.not.empty; });
    language: text/javascript
order: 6100
