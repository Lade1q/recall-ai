<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Recall AI">
  <!--
    Recall AI — favicon (#385).

    Mô-típ đồ thị khái niệm: một khái niệm mẹ nối xuống hai khái niệm nền. Đó là thứ sản phẩm
    này thực sự làm (Concept Graph Engine + truy ngược tiên quyết), nên nó nói được nhiều hơn
    một chữ cái đầu.

    Nền đặc lấy màu primary của design system (oklch(0.5 0.16 262) = #2c5dbd) thay vì nét mảnh:
    ở 16px, một khối đặc có tương phản cao vẫn đọc được trên cả thanh tab sáng lẫn tối, còn nét
    mảnh thì nhoè. Ba chấm cố tình to và tách xa nhau vì lý do đó.
  -->
  <rect width="32" height="32" rx="7" fill="#2c5dbd" />
  <g stroke="#f8fafe" stroke-width="2.4" stroke-linecap="round" opacity="0.92">
    <line x1="16" y1="11" x2="9.8" y2="21.2" />
    <line x1="16" y1="11" x2="22.2" y2="21.2" />
  </g>
  <g fill="#f8fafe">
    <circle cx="16" cy="10.6" r="4.1" />
    <circle cx="9.6" cy="21.6" r="3.3" />
    <circle cx="22.4" cy="21.6" r="3.3" />
  </g>
</svg>
